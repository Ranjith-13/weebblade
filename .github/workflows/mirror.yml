name: Mirror (manual)

# The off-site copy, on demand. The weekly pipeline does this automatically
# (pipeline-weekly.yml), but a backup nobody can check is a belief - so this is
# the button for "is my third copy actually there and actually correct", and the
# way the mirror was tested end-to-end before its first scheduled run.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "mirror the newest state, or verify what GitLab already holds"
        type: choice
        options: [mirror, verify]
        default: verify
      run_date:
        description: "release to mirror (YYYY-MM-DD); blank means the newest"
        type: string
        default: ""

# Shares the state with the pipeline runs: mirroring reads a release while a
# pipeline run may be replacing one.
concurrency:
  group: weebblade-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mirror or verify
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.action }}" = "verify" ]; then
            python -m pipeline.mirror --verify
          elif [ -n "${{ inputs.run_date }}" ]; then
            python -m pipeline.mirror --run-date "${{ inputs.run_date }}"
          else
            python -m pipeline.mirror
          fi

      # Only a mirror writes a ledger line, and only when it succeeded.
      - name: Record the digest
        if: inputs.action == 'mirror'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MIRROR.md || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Mirror $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
