name: Pipeline (daily)

# The anilist_airing DAG, run by GitHub instead of by Airflow on a server that
# costs money. Same steps, same order, same check - see pipeline/run.py.
#
# 06:00 UTC is mid-afternoon in Tokyo, before the evening's broadcasts, and
# clear of the weekly run at midnight Sunday; the two share AniList's 30
# requests a minute. GitHub's cron is best-effort and can be minutes late, which
# a daily catalogue does not care about.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Releases are where the state lives (pipeline/state.py), and the run log is a
# commit. Both need write; nothing here needs more.
permissions:
  contents: write

# One pipeline at a time, ever. Two runs would read the same state, work from
# it in parallel and both publish - and the second would quietly undo the first.
# Not cancel-in-progress: a half-finished run that gets killed mid-publish is
# worse than one that waits.
concurrency:
  group: weebblade-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: airflow/requirements.txt

      # The daily run touches three libraries, and -c rather than -r is how it
      # gets them at exactly the versions the Airflow image pins - including
      # duckdb 1.1.3, which behaves differently from newer ones in ways this
      # project has already been bitten by. A constraints file cannot drift from
      # a requirements file it IS.
      #
      # Installing all of airflow/requirements.txt here would pull
      # sentence-transformers, and with it the default torch wheel - several GB
      # of CUDA libraries that filled the runner's disk and failed this exact
      # step on the first run. The weekly workflow, which does need the model,
      # installs the CPU wheel first the way airflow/Dockerfile does.
      - run: pip install -c airflow/requirements.txt requests pyarrow duckdb

      - name: Restore state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -c "from pathlib import Path; import pipeline.state as s; s.fetch_state(Path('data'))"

      - name: Run the daily pipeline
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m pipeline.run daily --data-dir data

      # if: always() - the state is published whatever the check decided. Every
      # write is a new dated file, so a failed run's output is a record rather
      # than damage, and refusing to publish it would mean a run that fails its
      # check repeatedly freezes the pipeline and re-fetches the same day for
      # ever. That is not hypothetical: the last two weekly runs on the server
      # failed their checks while producing perfectly good data. Rollback is
      # restoring an older release, which is why eight are kept.
      - name: Publish state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "
          from pathlib import Path
          from datetime import datetime, timezone
          import pipeline.state as s
          s.publish_state(Path('data'), datetime.now(timezone.utc).strftime('%Y-%m-%d'))
          s.prune()
          "

      # A line per run, committed. Two jobs at once: it is the history of what
      # the pipeline did, readable without opening Actions - and it is repository
      # activity, which is what stops GitHub disabling a scheduled workflow after
      # 60 days of silence. [skip ci] so this push does not spend minutes
      # triggering the test workflow.
      - name: Write the run to RUNS.md
        if: always()
        run: |
          printf -- '- %s daily — %s ([log](%s/%s/actions/runs/%s))\n' \
            "$(date -u +%Y-%m-%d)" "${{ job.status }}" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" \
            > /tmp/line
          touch RUNS.md && cat RUNS.md >> /tmp/line && mv /tmp/line RUNS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RUNS.md
          git commit -m "Pipeline (daily) $(date -u +%Y-%m-%d) [skip ci]" || exit 0
          git push
