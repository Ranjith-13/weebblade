name: Backfill (manual)

# Past seasons into the lake, on demand. See ingestion/backfill.py for what a
# backfilled snapshot means - written under the season it describes, stamped
# with the day it was captured, and frozen at capture because the weekly run
# only ever refreshes the season it is running in.
#
# Manual and batched on purpose. This spends a lot of somebody else's rate
# limit, it is re-runnable and idempotent (a rerun overwrites the same dated
# files), and a failure on one source-season is recorded rather than raised -
# so the right way to use it is a few seasons at a time, reading the summary
# between batches, not one job that tries a decade.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "first season, e.g. 2020-WINTER"
        type: string
        required: true
      end:
        description: "last season, e.g. 2021-SUMMER"
        type: string
        required: true
      sources:
        description: "which sources to ask"
        type: string
        default: "mal,kitsu,anilist"
      dry_run:
        description: "fetch and check, write nothing"
        type: boolean
        default: true

# The pipeline's group: this restores and republishes the same state the daily
# and weekly runs do, and two of them writing it at once would lose one.
concurrency:
  group: weebblade-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Generous because this is upstream-rate-limited rather than CPU-bound, and
    # a stop is not a budget: a batch that hangs should cost an hour, not the
    # month's minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: airflow/requirements.txt

      # Same three libraries and the same constraints file as the daily run -
      # notably duckdb 1.1.3, and NOT airflow/requirements.txt, which would drag
      # in torch and fill the runner's disk.
      - run: pip install -c airflow/requirements.txt requests pyarrow duckdb

      - name: Restore state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -c "from pathlib import Path; import pipeline.state as s; s.fetch_state(Path('data'))"

      - name: Backfill
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: |
          python -m ingestion.backfill \
            "${{ inputs.start }}" "${{ inputs.end }}" \
            --sources "${{ inputs.sources }}" \
            --data-dir data \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # Only a real run has anything to publish, and only if: success() - unlike
      # the pipeline runs, there is no partial result here worth keeping over
      # the state that is already published.
      - name: Publish the state
        if: success() && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "
          from pathlib import Path
          from datetime import datetime, timezone
          import pipeline.state as s
          s.publish_state(Path('data'), datetime.now(timezone.utc).strftime('%Y-%m-%d'))
          "
