# Every push to main touching Python or data code: the Python test suite.
#
# Frontend checks live in .github/workflows/frontend.yml. They were separated
# so that documentation changes cost zero runner minutes, frontend commits do
# not run the Python test suite, and backend commits do not trigger a full
# Next.js build.
#
# THIS USED TO DEPLOY. It shipped the whole repository to an EC2 instance over
# SSH, punching a temporary security-group hole for the runner's own IP and
# revoking it afterwards. That instance was terminated on 13 October 2026 - the
# pipeline moved to Actions (.github/workflows/pipeline-*.yml) and the API to a
# free container built from backend/Dockerfile - so there is nothing to SSH to.
# The AWS secrets it used are deleted, and so are the Terraform, Caddy and SSH
# files that described the machine.
name: Python Tests

on:
  push:
    branches: [main]
    paths:
      - "ai/**"
      - "airflow/**"
      - "backend/**"
      - "ingestion/**"
      - "pipeline/**"
      - "processing/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"
  workflow_dispatch: {}

# Declared rather than inherited. This workflow reads the tree and runs tests;
# it writes nothing back, and a token that cannot write is one that cannot be
# turned against it.
permissions:
  contents: read

# Cancel any running job on this ref if a newer commit is pushed, avoiding
# burning runner minutes on obsolete commits.
concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # sentence-transformers pulls torch as a dependency, and PyPI's default wheel
      # is the CUDA/GPU build - several GB of unnecessary nvidia-*/triton packages
      # that exhausted disk on both the EC2 build and (found here) the Actions
      # runner's smaller disk too ("No space left on device"). Same fix as the
      # Airflow Dockerfile: install the CPU wheel first.
      #
      # Still needed here even though the API no longer uses torch at all: the
      # index is still built with sentence-transformers, and
      # tests/test_embed_backends.py is the check that the ONNX queries the API
      # sends still match it. That test can only run where both are installed.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - run: pip install -r requirements-dev.txt

      # python -m pytest (not bare `pytest`): -m prepends the repo root to
      # sys.path, which is what makes the top-level ingestion/processing/ai/backend
      # packages importable - matches how every local test run this project has
      # had was actually invoked.
      - run: python -m pytest tests/ -v
