name: Pipeline (weekly)

# The anime_seasonal_pipeline DAG, run by GitHub. Same steps, same order, same
# check - see pipeline/run.py. Sunday 00:00 UTC, as @weekly always meant.
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

# Shared with the daily run: the two must never touch the state at once, and on
# a Sunday they are both due.
concurrency:
  group: weebblade-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Longer than the daily because of MAL's related titles, which spends up to
    # 2,000 requests at the API's rate limit, and the embedding rebuild, which
    # is 6,349 titles through a sentence-transformers model on CPU - 54s on a
    # laptop. The timeout is a stop, not a budget: a run that hangs should cost
    # an hour of the month's 2,000 minutes, not all of them.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: airflow/requirements.txt

      # PySpark needs a JVM. consolidate.py is a window function over every
      # column of every source row, and it is the one step this project will not
      # rewrite to run without Spark - it is the entity resolution the whole
      # catalogue rests on, and it is tested as Spark code.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # CPU-only torch first, for the reason airflow/Dockerfile spells out:
      # sentence-transformers depends on torch, and PyPI's default wheel is the
      # CUDA build - several GB of nvidia-* libraries that are useless on a
      # CPU runner and fill its disk. Installing the CPU wheel first satisfies
      # the dependency before anything can pull the GPU one. The first run on
      # Actions died here, the same way the image build once did.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r airflow/requirements.txt

      - name: Restore state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -c "from pathlib import Path; import pipeline.state as s; s.fetch_state(Path('data'))"

      - name: Run the weekly pipeline
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m pipeline.run weekly --data-dir data

      # See the daily workflow for why this is if: always().
      - name: Publish state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "
          from pathlib import Path
          from datetime import datetime, timezone
          import pipeline.state as s
          s.publish_state(Path('data'), datetime.now(timezone.utc).strftime('%Y-%m-%d'))
          s.prune()
          "

      # The serving artifact: one portable file holding the catalogue and the
      # vectors. Separate from the state because it is for a reader, not for the
      # next run - and only the weekly makes one, since only the weekly rebuilds
      # the catalogue and the index. if: always(), for the same reason the state
      # is: a failing check does not mean the data is bad. The first weekly run
      # on Actions proved it - a correct catalogue, digest and index, and then a
      # red run over one title splitting. materialise returns None when there is
      # no warehouse, so a run that died earlier publishes nothing.
      - name: Publish the warehouse
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "
          from pathlib import Path
          from datetime import datetime, timezone
          import pipeline.state as s
          s.publish_warehouse(Path('data'), datetime.now(timezone.utc).strftime('%Y-%m-%d'))
          "

      # The third copy. Two copies in two places - GitHub releases and whichever
      # machine ran this - is one short of the usual rule, and the gap is "the
      # account goes AND the laptop goes", which nothing else covers.
      #
      # if: always() for the same reason publishing is: a run that failed its
      # checks still produced state worth copying, and the week a run goes wrong
      # is not the week to skip the backup. continue-on-error because this must
      # never be what fails a pipeline run - mirror() swallows everything anyway
      # and returns a line to print, so this is belt and braces.
      - name: Mirror the state off-site
        if: always()
        continue-on-error: true
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: python -m pipeline.mirror --run-date "$(date -u +%Y-%m-%d)"

      # The one failure in this project with a date on it. The repository is
      # private, so the live API cannot read its own warehouse without a token,
      # and GitHub caps a fine-grained one at a year - after which the catalogue
      # quietly stops advancing and the site 503s on its next restart, with the
      # pipeline and the deploy both green. The API says so once it has happened
      # (backend/app/warehouse.py logs it on a 401); this says so a month before.
      #
      # if: always(), because a run that failed its checks is not a reason to
      # skip telling somebody their credentials are about to lapse - if
      # anything it is the week they are least likely to notice on their own.
      # The step cannot fail the run: warn() swallows everything.
      - name: Warn if the API's token is running out
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m pipeline.token_expiry

      - name: Write the run to RUNS.md
        if: always()
        run: |
          printf -- '- %s weekly — %s ([log](%s/%s/actions/runs/%s))\n' \
            "$(date -u +%Y-%m-%d)" "${{ job.status }}" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" \
            > /tmp/line
          touch RUNS.md && cat RUNS.md >> /tmp/line && mv /tmp/line RUNS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # MIRROR.md too: the mirror writes the digest of what GitLab holds,
          # and it is only worth having if it lands in GitHub's history rather
          # than beside the copy it describes.
          git add RUNS.md MIRROR.md
          git commit -m "Pipeline (weekly) $(date -u +%Y-%m-%d) [skip ci]" || exit 0
          # Rebase and retry, because this push races. A run takes minutes and
          # anyone pushing to main in that window wins: the weekly run of
          # 2026-10-12 did every piece of work, published its state AND its
          # warehouse, and went red here on "! [rejected] (fetch first)" over a
          # one-line changelog. A note about a run must never be what fails it.
          #
          # Rebase rather than merge: this commit appends one line to the top of
          # RUNS.md, so replaying it onto whatever arrived is exactly right, and
          # a merge commit per run would be noise.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push rejected (attempt $attempt) - rebasing onto main and retrying"
            git pull --rebase --quiet || break
          done
          echo "Could not record the run in RUNS.md; the run itself is unaffected" >&2
          exit 1
