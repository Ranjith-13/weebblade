# Docker's json-file log driver has no size cap by default - the scheduler in
# particular runs forever and logs on every heartbeat/DAG-bag scan, so without this
# every service's stdout/stderr would grow unbounded on disk indefinitely. 10MB x 3
# files per service is plenty for debugging recent behavior without ever becoming a
# real disk concern.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-airflow-common: &airflow-common
  image: weebblade-airflow:2.10.4
  logging: *default-logging
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__BASE_URL: https://${AIRFLOW_HOST}
    AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "true"
    PYTHONPATH: /opt/airflow
    GROQ_API_KEY: ${GROQ_API_KEY:-}
    # Official MyAnimeList API v2. Free, from https://myanimelist.net/apiconfig
    # Unset is a supported state: fetch_mal skips rather than failing.
    MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
    # An ntfy topic that a run failing its own checks is pushed to
    # (processing/run_checks.py). Unset, the run still fails in Airflow, but
    # nobody is told.
    NTFY_TOPIC: ${NTFY_TOPIC:-}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./processing:/opt/airflow/processing
    - ./ai:/opt/airflow/ai
    # /data (not /opt/airflow/data): DuckDB bakes the absolute path into each view's
    # SQL at CREATE VIEW time (see processing/duckdb_catalog.py), so the backend
    # container - which opens the same warehouse.duckdb file - needs to see the data
    # directory at this exact same path, not just the same content.
    - ./data:/data
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    build: ./airflow
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Ranjith \
          --lastname SK \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}" || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    expose:
      - "8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  backend:
    build: ./backend
    logging: *default-logging
    environment:
      PYTHONPATH: /app
      DATA_DIR: /data
    volumes:
      - ./ai:/app/ai
      # Genuinely read-only now. It used to need a writable hole punched in it
      # for chromadb, whose Rust storage engine wanted lock and WAL files even to
      # answer a query; the vectors are a table in the warehouse instead, and the
      # backend only ever reads.
      - ./data:/data:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  caddy:
    build: ./caddy
    logging: *default-logging
    environment:
      # Read by basic_auth in the Caddyfile.
      #
      # The default lives HERE rather than in the Caddyfile, and that is the whole
      # point: `${VAR:-default}` substitutes when the variable is unset OR empty,
      # while Caddy's own `{$VAR:default}` only covers unset. Passing an empty
      # value is exactly what this block used to do, so Caddy saw an empty
      # username and password, refused to adapt the config, and crash-looped -
      # taking the public API down with it, because one Caddy serves both.
      #
      # The default is a bcrypt of 32 random bytes that were never recorded, so
      # the fallback fails closed: Airflow is unreachable, never unprotected.
      #
      # $$ is an escaped literal $ - compose interpolates values, and a bcrypt
      # hash is nothing but $-delimited fields, so an unescaped one gets eaten as
      # variable references. The same applies to the value you put in .env.
      AIRFLOW_BASIC_AUTH_USER: ${AIRFLOW_BASIC_AUTH_USER:-airflow}
      AIRFLOW_BASIC_AUTH_HASH: ${AIRFLOW_BASIC_AUTH_HASH:-$$2a$$14$$YOJF6swIiS5osPNNZ71QO.o7oE51TVCKrVwRJm7pPe4XFXOAG22gC}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      # A directory bind mount, not a single file - Caddy itself creates and
      # continuously appends to access.log inside it, nothing external ever
      # replaces the file, so this doesn't have the inode-swap problem a
      # deploy-overwritten single-file mount had (see PROGRESS.md).
      - ./caddy-logs:/var/log/caddy
    depends_on:
      backend:
        condition: service_healthy
      airflow-webserver:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-db-volume:
  airflow-logs:
  caddy-data:
  caddy-config:
